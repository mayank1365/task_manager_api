name: CI Pipeline - DevSecOps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: maven

    - name: Run Checkstyle (Linting)
      run: mvn checkstyle:check

    - name: Initialize CodeQL (SAST)
      uses: github/codeql-action/init@v3
      with:
        languages: java

    - name: Build for CodeQL
      run: mvn clean compile

    - name: Analyze with CodeQL
      uses: github/codeql-action/analyze@v3

    - name: Dependency Vulnerability Scan (SCA)
      run: mvn org.owasp:dependency-check-maven:check

    - name: Run Unit Tests
      run: mvn test

    - name: Package Application
      run: mvn clean package -DskipTests

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest .

    - name: Scan Docker Image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

    - name: Container Runtime Smoke Test
      run: |
        docker run -d -p 8080:8080 --name test-app ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest
        sleep 10
        curl -f http://localhost:8080/health

    - name: DockerHub Login
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    - name: Push Image to DockerHub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-api:latest
